name: Package skill

on:
  push:
    branches: [main]
    paths:
      - 'trpg-gm-plus/**'
      - '.github/workflows/package-skill.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build zip
        run: zip -r trpg-gm-plus.zip trpg-gm-plus
      - name: Publish to the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f latest
          git push -f origin latest
          gh release view latest >/dev/null 2>&1 || gh release create latest --title "trpg-gm-plus（最新）" --notes "main の trpg-gm-plus フォルダを自動で ZIP にしたものです。Claude の Skills にそのままアップロードできます。"
          gh release upload latest trpg-gm-plus.zip --clobber
